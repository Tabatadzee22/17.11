<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">

        <div class="left-side">
            <div class="logo">🟢 NEONCORE</div>
            <h1>// JOIN THE NEXUS</h1>
            <p class="main-subtitle">INITIALIZE YOUR NEONCORE IDENTITY</p>
            <div class="status-panel">
                <div class="status-header">
                    <span>OPERATOR ID</span>
                    <span>0/5 READY</span>
                </div>
                <div class="operator-id">UNASSIGNED</div>
                <div class="status-row"><span>CALLSIGN</span> <span class="pending">PENDING</span></div>
                <div class="status-row"><span>EMAIL</span> <span class="pending">PENDING</span></div>
                <div class="status-row"><span>PASSWORD</span> <span class="pending">PENDING</span></div>
                <div class="status-row"><span>CONFIRM</span> <span class="pending">PENDING</span></div>
                <div class="status-row"><span>TERMS</span> <span class="required">REQUIRED</span></div>
            </div>
        </div>
        <div class="container">
            <h2>NEW OPERATOR</h2>
            
            <div class="field">
                <label>CALLSIGN</label>
                <input type="text" placeholder="e.g. Vortex_07">
            </div>

            <div class="field">
                <label>EMAIL</label>
                <input type="email" placeholder="you@example.com">
            </div>

            <div class="field">
                <label>PASSWORD</label>
                <input type="password" placeholder="••••••••">
            </div>

            <div class="field">
                <label>CONFIRM PASSWORD</label>
                <input type="password" placeholder="••••••••">
            </div>

            <div class="checkbox-box">
                <input type="checkbox" id="terms">
                <label for="terms">I accept the Terms and Privacy Policy.</label>
            </div>

            <button class="btn">INITIALIZE ACCOUNT</button>
        </div>

    </div>

</body>
</html>
